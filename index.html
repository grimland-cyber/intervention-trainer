<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>מאמן התערבויות</title>
  <style>
/* ==========================================================================
   מאמן התערבויות — עיצוב קליני, רגוע, Mobile-First, RTL מלא, נגיש לעיוורון צבעים
   מותאם במיוחד לסמארטפון אנדרואיד (100dvh, אזורי מגע גדולים, Safe Area)
   ========================================================================== */

:root {
  --bg-app: #f4f6f8;
  --bg-surface: #ffffff;
  --bg-subtle: #edf1f5;
  --bg-patient-bubble: #ffffff;
  --bg-therapist-bubble: #1e3a5f;

  --text-primary: #121922;
  --text-secondary: #445164;
  --text-muted: #667385;
  --text-on-dark: #ffffff;

  --border-light: #d8e0e8;
  --border-strong: #b0becd;

  /* פלטת Okabe-Ito בטוחה לעיוורון צבעים (כחול עמוק מול כתום-ענבר, ללא אדום/ירוק) */
  --accent-primary: #1d4ed8;
  --accent-primary-hover: #1e40af;
  --accent-primary-soft: #eff6ff;

  --accent-amber: #b45309;
  --accent-amber-soft: #fffbeb;
  --accent-amber-border: #f59e0b;

  --neutral-badge-bg: #f1f5f9;
  --neutral-badge-text: #334155;

  --shadow-sm: 0 1px 3px rgba(18, 25, 34, 0.06);
  --shadow-md: 0 4px 12px rgba(18, 25, 34, 0.08);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Hebrew', Arial, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  height: 100%;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background-color: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.65;
  letter-spacing: normal;
  word-spacing: 0.03em;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

.ltr-num {
  unicode-bidi: isolate;
  direction: ltr;
  display: inline-block;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* מעטפת כללית */
.app-shell {
  max-width: 760px;
  margin-inline: auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.view {
  display: none;
  flex: 1;
  flex-direction: column;
}

.view.active {
  display: flex;
}

/* כפתורים בסיסיים — גובה מינימלי 48px לתקן אנדרואיד */
button {
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  touch-action: manipulation;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  min-height: 48px;
  padding-block: 10px;
  padding-inline: 18px;
  transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--accent-primary);
  outline-offset: 2px;
}

button:active {
  transform: scale(0.99);
}

.btn-primary {
  background-color: var(--accent-primary);
  color: var(--text-on-dark);
  font-weight: 600;
}

.btn-primary:hover {
  background-color: var(--accent-primary-hover);
}

.btn-secondary {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  border-color: var(--border-strong);
  font-weight: 600;
}

.btn-secondary:hover {
  background-color: var(--bg-subtle);
}

.btn-ghost {
  background-color: transparent;
  color: var(--text-secondary);
  border-color: var(--border-light);
  min-height: 42px;
  padding-block: 6px;
  padding-inline: 12px;
  font-size: 0.92rem;
}

.btn-ghost:hover {
  background-color: var(--bg-subtle);
}

/* ==========================================================================
   מסך בית
   ========================================================================== */
.home-header {
  background-color: var(--bg-surface);
  border-block-end: 1px solid var(--border-light);
  padding-block: 20px 18px;
  padding-inline: 18px;
}

.home-title {
  margin: 0 0 6px 0;
  font-size: 1.55rem;
  font-weight: 700;
  color: var(--text-primary);
}

.home-subtitle {
  margin: 0;
  font-size: 0.96rem;
  color: var(--text-secondary);
}

.home-actions-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding-block: 16px 8px;
  padding-inline: 16px;
}

@media (max-width: 420px) {
  .home-actions-bar {
    grid-template-columns: 1fr;
  }
}

.section-heading-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-inline: 18px;
  padding-block: 12px 6px;
}

.section-heading {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-primary);
}

.section-count {
  font-size: 0.88rem;
  color: var(--text-muted);
}

.scenarios-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  padding-inline: 16px;
  padding-block-end: 24px;
}

@media (min-width: 620px) {
  .scenarios-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.scenario-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  text-align: start;
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.scenario-card:hover {
  border-color: var(--accent-primary);
  box-shadow: var(--shadow-md);
}

.scenario-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.scenario-name-title {
  margin: 0;
  font-size: 1.06rem;
  font-weight: 700;
  color: var(--text-primary);
}

.difficulty-badge {
  font-size: 0.8rem;
  font-weight: 600;
  padding-block: 3px;
  padding-inline: 9px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-subtle);
  color: var(--text-secondary);
  white-space: nowrap;
  border: 1px solid var(--border-light);
}

.scenario-desc {
  margin: 6px 0 0 0;
  font-size: 0.94rem;
  color: var(--text-secondary);
}

.scenario-footer-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-block-start: 8px;
  border-block-start: 1px solid var(--bg-subtle);
  font-size: 0.85rem;
  color: var(--text-muted);
}

.scenario-start-cta {
  font-weight: 700;
  color: var(--accent-primary);
}

.home-disclaimer {
  margin-block-start: auto;
  padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-inline: 16px;
  text-align: center;
  font-size: 0.88rem;
  color: var(--text-secondary);
  border-block-start: 1px solid var(--border-light);
  background-color: var(--bg-surface);
}

/* ==========================================================================
   מסך הסשן (נקי לחלוטין ממשוב ותיוגים, מותאם 100dvh לאנדרואיד)
   ========================================================================== */
.session-view {
  height: 100vh;
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
  background-color: var(--bg-app);
}

.session-topbar {
  flex-shrink: 0;
  background-color: var(--bg-surface);
  border-block-end: 1px solid var(--border-light);
  padding-block: 10px;
  padding-inline: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.session-patient-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.session-patient-name {
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.session-turn-counter {
  font-size: 0.84rem;
  color: var(--text-secondary);
}

.session-topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.btn-end-session {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  font-weight: 600;
  min-height: 42px;
  padding-block: 6px;
  padding-inline: 12px;
  font-size: 0.9rem;
}

/* אזור בועות השיחה */
.chat-stream {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.bubble-row {
  display: flex;
  flex-direction: column;
  max-width: 86%;
}

.bubble-row.patient {
  align-self: flex-start;
}

.bubble-row.therapist {
  align-self: flex-end;
}

.bubble-sender {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-block-end: 3px;
  padding-inline: 4px;
}

.bubble {
  padding-block: 12px;
  padding-inline: 15px;
  border-radius: var(--radius-lg);
  font-size: 1.02rem;
  line-height: 1.6;
  word-wrap: break-word;
  box-shadow: var(--shadow-sm);
}

.bubble-row.patient .bubble {
  background-color: var(--bg-patient-bubble);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-start-start-radius: 4px;
}

.bubble-row.therapist .bubble {
  background-color: var(--bg-therapist-bubble);
  color: var(--text-on-dark);
  border-start-end-radius: 4px;
}

.typing-indicator {
  align-self: flex-start;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-pill);
  padding-block: 6px;
  padding-inline: 14px;
  font-size: 0.88rem;
  color: var(--text-secondary);
}

/* מעגן שליטה תחתון בסשן: מיקרופון גדול + תיבת הקלדה כגיבוי */
.session-controls-dock {
  flex-shrink: 0;
  background-color: var(--bg-surface);
  border-block-start: 1px solid var(--border-light);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-inline: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.speech-notice {
  background-color: var(--accent-amber-soft);
  border: 1px solid var(--accent-amber-border);
  color: var(--text-primary);
  font-size: 0.86rem;
  padding-block: 8px;
  padding-inline: 12px;
  border-radius: var(--radius-sm);
}

.live-transcript-box {
  background-color: var(--accent-primary-soft);
  border: 1px solid var(--accent-primary);
  border-radius: var(--radius-md);
  padding-block: 10px;
  padding-inline: 14px;
  font-size: 0.98rem;
  color: var(--text-primary);
  min-height: 46px;
}

.ptt-row {
  display: flex;
  align-items: stretch;
  gap: 8px;
}

.btn-ptt {
  flex: 1;
  min-height: 68px;
  border-radius: var(--radius-lg);
  background-color: var(--accent-primary);
  color: var(--text-on-dark);
  font-size: 1.1rem;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  box-shadow: var(--shadow-md);
}

.btn-ptt:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-ptt.recording {
  background-color: #1e3a8a;
  outline: 4px solid #93c5fd;
}

.btn-ptt-sub {
  font-size: 0.8rem;
  font-weight: 400;
  opacity: 0.92;
}

.btn-cancel-rec {
  min-width: 84px;
  min-height: 68px;
  background-color: var(--bg-subtle);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  font-weight: 600;
}

/* שורת הקלדה לגיבוי */
.text-backup-form {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.text-backup-input {
  flex: 1;
  min-height: 48px;
  max-height: 110px;
  padding-block: 10px;
  padding-inline: 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 1rem;
  line-height: 1.4;
  resize: none;
  color: var(--text-primary);
  background-color: var(--bg-app);
}

.text-backup-input:focus {
  background-color: var(--bg-surface);
}

.btn-send-text {
  min-width: 78px;
  min-height: 48px;
  background-color: var(--bg-surface);
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary);
  font-weight: 700;
}

.btn-send-text:hover {
  background-color: var(--accent-primary-soft);
}

/* ==========================================================================
   מסך דוח סוף סשן ומסך היסטוריה
   ========================================================================== */
.page-topbar {
  background-color: var(--bg-surface);
  border-block-end: 1px solid var(--border-light);
  padding-block: 14px;
  padding-inline: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.page-topbar-title {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 700;
}

.report-content,
.history-content {
  padding: 16px;
  padding-block-end: calc(28px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.report-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}

.report-card-title {
  margin: 0 0 12px 0;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-primary);
  border-block-end: 1px solid var(--bg-subtle);
  padding-block-end: 8px;
}

.report-summary-banner {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}

.summary-meta-item {
  display: flex;
  flex-direction: column;
}

.summary-meta-val {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-primary);
}

.summary-meta-lbl {
  font-size: 0.84rem;
  color: var(--text-secondary);
}

/* מדדי מכניקה — המספר קודם להסבר */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

@media (min-width: 580px) {
  .metrics-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

.metric-box {
  background-color: var(--bg-app);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.metric-number {
  font-size: 1.65rem;
  font-weight: 700;
  line-height: 1.15;
  color: var(--text-primary);
}

.metric-title {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-primary);
}

.metric-sub {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

/* פרופיל התערבויות — פסים אופקיים + השפעה על פתיחות */
.profile-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.profile-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding-block-end: 10px;
  border-block-end: 1px solid var(--bg-subtle);
}

.profile-row:last-child {
  border-block-end: none;
  padding-block-end: 0;
}

.profile-row-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}

.profile-num-first {
  font-weight: 700;
  font-size: 1rem;
  color: var(--text-primary);
}

.profile-type-name {
  font-weight: 600;
  color: var(--text-primary);
  margin-inline-start: 6px;
}

.delta-pill {
  font-size: 0.82rem;
  font-weight: 600;
  padding-block: 2px;
  padding-inline: 8px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
}

.delta-up {
  background-color: var(--accent-primary-soft);
  color: var(--accent-primary-hover);
  border-color: #93c5fd;
}

.delta-down {
  background-color: var(--accent-amber-soft);
  color: var(--accent-amber);
  border-color: var(--accent-amber-border);
}

.delta-neutral {
  background-color: var(--neutral-badge-bg);
  color: var(--neutral-badge-text);
  border-color: var(--border-light);
}

.bar-track {
  width: 100%;
  height: 10px;
  background-color: var(--bg-subtle);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background-color: var(--accent-primary);
  border-radius: var(--radius-pill);
}

.bar-fill.down-bar {
  background-color: var(--accent-amber);
}

.bar-fill.neutral-bar {
  background-color: #64748b;
}

/* שני רגעים מסומנים */
.highlight-block {
  border-inline-start: 4px solid var(--accent-primary);
  background-color: var(--bg-app);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-block-end: 12px;
}

.highlight-block.repair-moment {
  border-inline-start-color: var(--accent-amber);
}

.highlight-block:last-child {
  margin-block-end: 0;
}

.highlight-heading {
  margin: 0 0 6px 0;
  font-size: 0.98rem;
  font-weight: 700;
}

.quote-context {
  font-size: 0.86rem;
  color: var(--text-secondary);
  margin-block-end: 6px;
}

.quote-user {
  margin: 6px 0;
  padding: 8px 12px;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  font-weight: 600;
}

.alternative-box {
  margin-block-start: 8px;
  padding: 10px 12px;
  background-color: var(--accent-primary-soft);
  border: 1px solid #bfdbfe;
  border-radius: var(--radius-sm);
  font-size: 0.94rem;
}

/* גרף מעקב לאורך זמן וטבלה מצטברת */
.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-block-end: 10px;
  font-size: 0.88rem;
  font-weight: 600;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.chart-scroll-wrap {
  width: 100%;
  overflow-x: auto;
}

.trend-svg {
  width: 100%;
  min-width: 300px;
  height: auto;
  display: block;
}

.data-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  text-align: start;
}

.data-table th,
.data-table td {
  padding: 9px 8px;
  border-block-end: 1px solid var(--border-light);
  text-align: start;
}

.data-table th {
  background-color: var(--bg-subtle);
  font-weight: 700;
  color: var(--text-primary);
}

/* תמליל מלא לפי תור */
details.turns-accordion summary {
  cursor: pointer;
  font-weight: 700;
  padding-block: 6px;
  color: var(--accent-primary);
}

.turn-log-item {
  padding-block: 10px;
  border-block-end: 1px solid var(--border-light);
  font-size: 0.92rem;
}

.turn-log-item:last-child {
  border-block-end: none;
}

/* רשימת היסטוריית סשנים */
.history-session-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.history-item-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  align-items: center;

    /(?:^|\s)איזה\s+יופי(?=\s|$)/,
    /(?:^|\s)(?:את|אתה)\s+(?:ממש\s+|לגמרי\s+)?(?:בסדר\s+גמור|אמיץ|אמיצה|צודק|צודקת|נהדר|נהדרת)(?=\s|$)/,
    /(?:^|\s)אמיץ\s+מצדך(?=\s|$)/,
    /(?:^|\s)אני\s+גאה\s+בך(?=\s|$)/
  ];

  // ביטויי תיקון (בעלות של המטפל על פספוס קודם)
  const REPAIR_PATTERNS = [
    /ניסחתי\s+(?:את\s+זה\s+)?לא\s+(?:ברור|טוב|מדויק|נכון)/,
    /לא\s+ניסחתי\s+(?:את\s+זה\s+)?(?:ברור|טוב|מדויק|נכון)/,
    /סליחה\s*,?\s*(?:אני\s+)?(?:התבלבלתי|טעיתי|פספסתי|מיהרתי|נמהרתי|לחצתי|קטעתי)/,
    /(?:^|\s)(?:אני\s+)?(?:התבלבלתי|פספסתי\s+אותך|טעיתי\s+בניסוח)(?=\s|$)/,
    /(?:^|\s)אני\s+(?:מתנצל|מתנצלת)(?=\s|$)/,
    /(?:^|\s)(?:בוא|בואי)\s+ננסה\s+שוב(?=\s|$)/,
    /(?:^|\s)אפשר\s+לנסות\s+שוב(?=\s|$)/,
    /(?:^|\s)אני\s+(?:לוקח|לוקחת)\s+(?:את\s+זה\s+חזרה|צעד\s+אחורה)(?=\s|$)/,
    /(?:^|\s)לא\s+הקשבתי\s+מספיק(?=\s|$)/,
    /(?:^|\s)מיהרתי\s+מדי(?=\s|$)/
  ];

  // ביטויי תצפית בתחילת התור
  const OBSERVATION_START_REGEX =
    /^(?:רגע\s+|אה\s+|אממ\s+|טוב\s+)?(?:אני\s+(?:שם|שמה)\s+לב(?:\s+ש|\s+איך|\s+לכך|\s+לזה|\s+שאת|\s+שאתה|\s+)?|שמתי\s+לב(?:\s+ש|\s+איך|\s+)?|אני\s+רואה(?:\s+ש|\s+איך|\s+את|\s+)?|אני\s+(?:שומע|שומעת)(?:\s+ש|\s+איך|\s+בקול|\s+אותך|\s+)?)/;

  // ביטויי רגש של המטפל
  const THERAPIST_EMOTION_PATTERNS = [
    /(?:^|\s)אני\s+(?:מרגיש|מרגישה)(?=\s|$)/,
    /(?:^|\s)אני\s+(?:תופס|תופסת)\s+את\s+עצמי(?=\s|$)/,
    /(?:^|\s)תפסתי\s+את\s+עצמי(?=\s|$)/,
    /(?:^|\s)(?:עולה|עולים|עולות)\s+בי(?=\s|$)/,
    /(?:^|\s)(?:מתעורר|מתעוררת)\s+בי(?=\s|$)/,
    /(?:^|\s)אני\s+(?:מוצא|מוצאת)\s+את\s+עצמי(?=\s|$)/
  ];

  // ביטויי סיכום
  const SUMMARY_PATTERNS = [
    /^(?:אז\s+בעצם|אם\s+אני\s+(?:מבין|מבינה)\s+נכון|אז\s+מה\s+ש(?:את\s+אומרת|אתה\s+אומר)\s+זה|בוא\s+נעשה\s+(?:רגע\s+)?סדר|בואי\s+נעשה\s+(?:רגע\s+)?סדר|לסיכום\s+מה\s+שאמרת|אז\s+דיברת\s+גם\s+על)/
  ];

  // ביטויי פרשנות (קישור לעבר, לדפוס או סיבתיות על עולמו של המטופל)
  const INTERPRETATION_PATTERNS = [
    /(?:^|\s)(?:זה\s+)?מזכיר\s+(?:לי\s+)?את(?=\s|$)/,
    /(?:^|\s)(?:אולי\s+|נראה\s+ש|יכול\s+להיות\s+ש)?זה\s+קשור\s+ל/,
    /(?:^|\s)יש\s+קשר\s+בין\s+.+\s+ל/,
    /(?:^|\s)(?:זה\s+דפוס|הדפוס\s+שלך|זה\s+מנגנון|מנגנון\s+הגנה)(?=\s|$)/,
    /(?:^|\s)כמו\s+(?:עם\s+|מול\s+|בבית\s+עם\s+)(?:אמא|אבא|ההורים|בילדות|בעבר)/,
    /(?:^|\s)(?:את|אתה)\s+(?:עושה|אומר|אומרת|צוחק|צוחקת|שותק|שותקת|תוקף|תוקפת|מתנצל|מתנצלת|מבקש|מבקשת).+\s+(?:כי|בגלל\s+ש|משום\s+ש|כדי\s+שלא|כדי\s+להימנע|כדי\s+להגן)\s+/,
    /(?:^|\s)(?:כי|בגלל\s+ש)\s+(?:את|אתה|בעומק|בפנים|מתחת)\s+/,
    /(?:^|\s)נראה\s+לי\s+ש(?:את|אתה)\s+(?:פוחד|פוחדת|מפחד|מפחדת|מנסה\s+להסתיר|מגן|מגנה|בורח|בורחת)/
  ];

  // מילות מפתח של הרצאה / הסבר תיאורטי או הוראתי (כאשר התור מעל 35 מילים)
  const LECTURE_KEYWORDS = [
    'מחקרים', 'בפסיכולוגיה', 'תיאוריה', 'מנגנון', 'מנגנוני', 'באופן כללי',
    'חשוב להבין', 'צריך להבין', 'המוח', 'מערכת העצבים', 'טראומה', 'ויסות',
    'כשבני אדם', 'אנשים בדרך כלל', 'הדרך הנכונה', 'מה שכדאי לך לעשות',
    'אתה צריך', 'את צריכה', 'אתה חייב', 'את חייבת', 'תהליך טיפולי', 'השלכה', 'הדחקה'
  ];

  function countWords(text) {
    const clean = normalizeHebrewText(text);
    if (!clean) return 0;
    return clean.split(' ').filter(Boolean).length;
  }

  /**
   * נרמול מילה בעברית להשוואת חפיפה בהדהוד (הסרת תחיליות קלות והמרת גוף ראשון <-> שני)
   */
  function stemForEcho(word) {
    let w = word.trim();
    if (!w) return '';
    // הסרת תחילית ו/ה/ש/ב/ל/מ/כ למילים ארוכות מ-3 אותיות
    if (w.length >= 4 && /^[והשבמלכ]/.test(w)) {
      w = w.slice(1);
    }
    // נרמול סיומת עבר גוף ראשון ("צחקתי" -> "צחקת") או שייכות ("שלי"/"שלך" כבר במילות תפקוד)
    if (w.length >= 4 && w.endsWith('תי')) {
      w = w.slice(0, -1); // "צחקתי" -> "צחקת"
    }
    return w;
  }

  function getContentStems(text) {
    const clean = normalizeHebrewText(text);
    if (!clean) return [];
    const tokens = clean.split(' ').filter(Boolean);
    const result = [];
    for (const tok of tokens) {
      if (FUNCTION_WORDS.has(tok)) continue;
      if (tok.length < 2) continue;
      const stemmed = stemForEcho(tok);
      if (stemmed && !FUNCTION_WORDS.has(stemmed)) {
        result.push({ raw: tok, stem: stemmed });
      }
    }
    return result;
  }

  /**
   * בדיקת מתן בחירה: הצעת אפשרויות ("אפשר... או...") + שאלת העדפה מפורשת ("מה מתאים לך?")
   */
  function isGivingChoice(rawText, cleanText) {
    const hasOptions =
      /(?:אפשר|יכולים|נוכל|תרצה|תרצי|לבחור|אופציה)\s+.+\s+או\s+/.test(cleanText) ||
      /\s+או\s+ש(?:אפשר|נעצור|נמשיך|נדבר|נשתוק|נישאר)/.test(cleanText);

    const hasPreferenceAsk =
      /(?:מה\s+(?:מתאים|נכון|עדיף|נוח)\s+לך|מה\s+(?:את\s+מעדיפה|אתה\s+מעדיף|היית\s+רוצה|מרגיש\s+לך\s+נכון|תבחר|תבחרי)|איך\s+(?:מתאים|נוח|נכון)\s+לך|איפה\s+(?:תרצה|תרצי|מתאים\s+לך)\s+להתחיל|הבחירה\s+(?:שלך|בידיים\s+שלך))/.test(
        cleanText
      );

    return hasOptions && hasPreferenceAsk;
  }

  /**
   * ניתוח שאלות בטקסט — עובד הן בטקסט מוקלד עם '?' והן בתמלול דיבור ללא סימני פיסוק!
   */
  function analyzeQuestions(rawText, cleanText) {
    const qMarks = (String(rawText || '').match(/[?؟]/g) || []).length;

    // פיצול למשפטים לפי סימני סיום משפט
    const rawSentences = String(rawText || '')
      .split(/(?<=[.!?؟])\s+|\n+/)
      .map((s) => s.trim())
      .filter(Boolean);

    // ספירת פסוקיות שאלה תחביריות בעברית
    const tokens = cleanText ? cleanText.split(' ').filter(Boolean) : [];
    let syntacticQuestionClauses = 0;
    let inEmbeddedPerceptionClause = false;

    for (let i = 0; i < tokens.length; i++) {
      const tok = tokens[i];
      const prev = i > 0 ? tokens[i - 1] : '';
      const prev2 = i > 1 ? tokens[i - 2] : '';
      const next = i + 1 < tokens.length ? tokens[i + 1] : '';

      // בדיקת מילת שאלה ישירה או עם ו' החיבור ("ואיך", "ולמה", "ומה", "ומתי", "ואיפה")
      let baseInterrogative = null;
      if (INTERROGATIVE_WORDS.has(tok)) {
        baseInterrogative = tok;
      } else if (tok.startsWith('ו') && INTERROGATIVE_WORDS.has(tok.slice(1))) {
        baseInterrogative = tok.slice(1);
      }

      if (baseInterrogative) {
        // סינון קריאות התפעלות ("איזה יופי", "איזה משפט קשה") ללא סימן שאלה
        if (
          (baseInterrogative === 'איזה' || baseInterrogative === 'איזו') &&
          /^(?:יופי|משפט|אמירה|מדהים|נהדר|קשה|כאב|אומץ)$/.test(next) &&
          qMarks === 0
        ) {
          continue;
        }

        // סינון פסוקיות מושא עקיפות ("אני שומע מה את אומרת ואיך הקול שלך נחלש", "אני שם לב כמה זה כואב")
        const prevClean = prev.replace(/^[והשבמלכ]/, '');
        const directlyAfterEmbeddingVerb =
          i > 0 &&
          !tok.startsWith('ו') &&
          (EMBEDDING_VERBS.has(prev) ||
            EMBEDDING_VERBS.has(prevClean) ||
            (prev === 'לב' && (prev2 === 'שם' || prev2 === 'שמה' || prev2 === 'שמתי')));

        if (directlyAfterEmbeddingVerb) {
          inEmbeddedPerceptionClause = true;
          continue;
        }

        if (tok.startsWith('ו') && inEmbeddedPerceptionClause && qMarks === 0) {
          continue;
        }

        // סינון "מה ש..." יחסית ("מה שאמרת", "מה שקרה") כשהיא לא שאלה ("מה קרה")
        if ((baseInterrogative === 'מה' || baseInterrogative === 'מי') && next.startsWith('ש')) {
          continue;
        }

        // סינון "כמו מה", "כל מה"
        if (prev === 'כל' || prev === 'כמו' || prev === 'לפי') {
          continue;
        }

        inEmbeddedPerceptionClause = false;
        syntacticQuestionClauses++;
        continue;
      }

      // פעלי שאלה מנומסים ("תוכל לספר", "תוכלי לשתף", "אפשר לשאול")
      if (
        (tok === 'תוכל' || tok === 'תוכלי' || tok === 'אפשר') &&
        /^(?:לספר|לשתף|לשאול|להסביר|להגיד|לומר)$/.test(next)
      ) {
        syntacticQuestionClauses++;
      }

      // צירופי שאלה בני שתי מילים: "על מה", "בשביל מה", "איך זה"
      if (
        ((tok === 'על' || tok === 'ועל') && next === 'מה') ||
        (tok === 'בשביל' && next === 'מה')
      ) {
        // הלולאה תפגוש את "מה" באיטרציה הבאה, אז לא נספור פעמיים
        continue;
      }
    }

    // חישוב מספר השאלות הכולל בתור
    let questionCount = Math.max(qMarks, syntacticQuestionClauses);

    // מקרה של שאלה אינטונטיבית עם סימן שאלה אחד ופסוקית תחבירית אחת — זו שאלה אחת, לא שתיים
    // לכן Math.max מונע כפילות על "מה קרה?" (qMarks=1, syntactic=1 -> 1)
    // ועל "מה קרה? את בסדר?" (qMarks=2, syntactic=1 -> 2)
    // ועל "מה קרה ולמה צחקת" בתמלול קולי ללא '?' (qMarks=0, syntactic=2 -> 2)

    // זיהוי תבנית "שאלת תפריט" ("או... או..." / שאלה עם אפשרויות סגורות מופרדות ב-"או")
    const orCount = (cleanText.match(/(?:^|\s)או(?=\s|$)/g) || []).length;
    const isMenuPattern =
      (orCount >= 2 && (questionCount >= 1 || /^(?:זה|את|אתה|הוא|היא)/.test(cleanText))) ||
      (orCount === 1 &&
        (qMarks === 1 || syntacticQuestionClauses === 1 || /^(?:האם|זה|את|אתה)\s+/.test(cleanText)) &&
        !/אם\s+אני\s+מבין/.test(cleanText));

    if (isMenuPattern && questionCount === 0) {
      questionCount = 1;
    }

    let subtype = null;
    if (questionCount >= 2 && !(orCount >= 1 && qMarks <= 1 && syntacticQuestionClauses <= 1)) {
      subtype = 'multiple';
    } else if (isMenuPattern && qMarks <= 1) {
      subtype = 'menu';
      questionCount = 1;
    } else if (questionCount === 1) {
      subtype = 'single';
    }

    return {
      questionCount,
      qMarks,
      syntacticQuestionClauses,
      subtype,
      rawSentences
    };
  }

  /**
   * בדיקה האם קיים תיוג/שיפוט שלא נאמר במקור ע"י המטופל עצמו בתור האחרון
   */
  function findLabelingTerm(cleanText, lastPatientText) {
    const patientClean = normalizeHebrewText(lastPatientText || '');
    const tokens = cleanText.split(' ').filter(Boolean);
    const patientTokens = new Set(patientClean.split(' ').filter(Boolean));

    for (const tok of tokens) {
      const stripped = tok.length >= 4 ? tok.replace(/^[והשבמלכ]/, '') : tok;
      for (const term of LABELING_TERMS) {
        if (tok === term || stripped === term) {
          // אם המטופל עצמו אמר את המילה המדויקת הזו והמטפל רק מהדהד אותה קצר — לא נתייג כשפיטה
          if (patientTokens.has(term) && tokens.length <= 5) {
            continue;
          }
          return tok;
        }
      }
    }
    return null;
  }

  /**
   * בדיקת הדהוד: חזרה על מילה או ביטוי מדברי המטופל בתור הקודם, בלי תוספת תוכן חדש
   */
  function detectEcho(cleanText, lastPatientText, wordCount, questionCount) {
    if (!lastPatientText || wordCount === 0 || wordCount > 12 || questionCount > 0) {
      return { isEcho: false, echoedPhrase: null };
    }

    const userContent = getContentStems(cleanText);
    const patientContent = getContentStems(lastPatientText);

    if (userContent.length === 0 || patientContent.length === 0) {
      return { isEcho: false, echoedPhrase: null };
    }

    const patientStems = new Set(patientContent.map((c) => c.stem));
    const matchedWords = [];
    let unmatchedCount = 0;

    for (const item of userContent) {
      if (patientStems.has(item.stem)) {
        matchedWords.push(item.raw);
      } else {
        unmatchedCount++;
      }
    }

    // הדהוד דורש לפחות מילה משמעותית אחת מהמטופל וללא הוספת תוכן חדש (אפס מילים חדשות, או לכל היותר מילת מסגור אחת בתור של 4+ מילים)
    const isCleanOverlap =
      matchedWords.length >= 1 &&
      (unmatchedCount === 0 || (matchedWords.length >= 3 && unmatchedCount <= 1));

    if (!isCleanOverlap) {
      return { isEcho: false, echoedPhrase: null };
    }

    return {
      isEcho: true,
      echoedPhrase: matchedWords.join(' ')
    };
  }

  /**
   * בדיקה האם נוספה תוספת אחרי משפט שלם
   */
  function detectAddOn(rawText, cleanText, primaryKey, secondaryType) {
    // כלל מפורש: תצפית + שאלה מסומן כתוספת
    if (primaryKey === 'observation' && secondaryType === 'question') {
      return true;
    }

    // מתן בחירה ותיקון קצר בנויים משני חלקים כחלק ממהלך אחד תקין
    if (primaryKey === 'choice') {
      return false;
    }
    if (primaryKey === 'repair' && countWords(cleanText) <= 9) {
      return false;
    }

    // פיצול לפי פיסוק מסמן סיום משפט (. ! ? ; —)
    const segments = String(rawText || '')
      .split(/(?:[.!?؟;—]+|\s+-\s+)/)
      .map((s) => normalizeHebrewText(s))
      .filter(Boolean);

    if (segments.length >= 2) {
      const firstWords = countWords(segments[0]);
      const secondWords = countWords(segments.slice(1).join(' '));
      // משפט ראשון שלם (>= 3 מילים) ואחריו משפט נוסף משמעותי
      if (firstWords >= 3 && secondWords >= 2) {
        return true;
      }
    }

    // זיהוי תוספת בדיבור רציף ללא סימני פיסוק (למשל "אני שם לב שאת צוחקת ואני חושב שזה הגנה")
    if (
      primaryKey === 'observation' &&
      /\s+(?:ואני\s+חושב|ואני\s+חושבת|ואולי\s+זה|כי\s+את|כי\s+אתה|זה\s+בטח|זה\s+כנראה)\s+/.test(cleanText)
    ) {
      return true;
    }

    return false;
  }

  /**
   * הפונקציה המרכזית לסיווג תור של המשתמש.
   * @param {string} userText - תמליל התור של המשתמש
   * @param {object} context - { lastPatientText: string, allPatientTexts: string[] }
   */
  function classifyTurn(userText, context = {}) {
    const raw = String(userText || '').trim();
    const clean = normalizeHebrewText(raw);
    const lastPatientText = context.lastPatientText || '';
    const allPatientTexts = Array.isArray(context.allPatientTexts)
      ? context.allPatientTexts
      : lastPatientText
      ? [lastPatientText]
      : [];

    const wordCount = countWords(clean);
    const qInfo = analyzeQuestions(raw, clean);
    const introducedEmotions = findIntroducedEmotions(raw, allPatientTexts);

    // 1. כלל קדימות עליון: תיקון גובר על הכול
    for (const pat of REPAIR_PATTERNS) {
      if (pat.test(clean)) {
        // וידוא שלא מדובר בהדהוד של המילה "סליחה" מדברי המטופלת ("המתנצלת")
        const isEchoingPatientApology =
          /סליחה\s+ש(?:את|איחרת)/.test(clean) && !/אני|ניסחתי|התבלבלתי|ננסה/.test(clean);
        if (!isEchoingPatientApology) {
          const secondary = qInfo.questionCount >= 1 ? 'question' : null;
          return buildResult({
            raw,
            primaryKey: 'repair',
            secondaryType: secondary,
            questionSubtype: qInfo.subtype,
            wordCount,
            questionCount: qInfo.questionCount,
            hasAddOn: detectAddOn(raw, clean, 'repair', secondary),
            introducedEmotions,
            echoedPhrase: null
          });
        }
      }
    }

    // 2. מתן בחירה מפורש (נבדק לפני שאלות כדי ש"אפשר א או ב, מה מתאים לך?" לא יסווג כשאלת תפריט/שאלות מרובות)
    if (isGivingChoice(raw, clean)) {
      return buildResult({
        raw,
        primaryKey: 'choice',
        secondaryType: null,
        questionSubtype: null,
        wordCount,
        questionCount: qInfo.questionCount,
        hasAddOn: false,
        introducedEmotions,
        echoedPhrase: null
      });
    }

      'ממוצע מילים מצטבר: <span class="ltr-num"><strong>' + stats.overallAvgWords + '</strong></span>).' +
      '</p>' +
      '<div class="data-table-wrap">' +
      '<table class="data-table">' +
      '<thead><tr><th>סוג התערבות</th><th>כמות ואחוז</th><th>השפעה מצטברת על פתיחות</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody>' +
      '</table>' +
      '</div>'
    );
  }

  function initApp() {
    const views = {
      home: document.getElementById('view-home'),
      session: document.getElementById('view-session'),
      report: document.getElementById('view-report'),
      history: document.getElementById('view-history')
    };

    const scenariosGridEl = document.getElementById('scenarios-grid');
    const scenariosCountEl = document.getElementById('scenarios-count');
    const btnFreeSession = document.getElementById('btn-free-session');
    const btnOpenHistory = document.getElementById('btn-open-history');

    // אלמנטים במסך הסשן
    const sessionPatientNameEl = document.getElementById('session-patient-name');
    const sessionTurnCounterEl = document.getElementById('session-turn-counter');
    const btnToggleTts = document.getElementById('btn-toggle-tts');
    const btnEndSession = document.getElementById('btn-end-session');
    const chatStreamEl = document.getElementById('chat-stream');
    const speechNoticeEl = document.getElementById('speech-notice');
    const liveTranscriptEl = document.getElementById('live-transcript-box');
    const btnPtt = document.getElementById('btn-ptt');
    const btnPttMainText = document.getElementById('btn-ptt-main');
    const btnPttSubText = document.getElementById('btn-ptt-sub');
    const btnCancelRec = document.getElementById('btn-cancel-rec');
    const textBackupForm = document.getElementById('text-backup-form');
    const textBackupInput = document.getElementById('text-backup-input');
    const btnSendText = document.getElementById('btn-send-text');

    // אלמנטים במסך דוח והיסטוריה
    const reportBodyEl = document.getElementById('report-body');
    const btnReportBackHome = document.getElementById('btn-report-home');
    const historyBodyEl = document.getElementById('history-body');
    const btnHistoryBackHome = document.getElementById('btn-history-home');

    let activeSession = null;
    let isBusyPatientTurn = false;
    let isPatientSpeaking = false;
    let isRecording = false;
    let isFinalizingVoice = false;
    let liveDraftTranscript = '';
    let silenceTimerId = null;
    let consecutiveSilencesThisTurn = 0;
    let activeSpeechHandle = null;
    let lastScenarioIdPlayed = null;
    let reportReturnView = 'home';
    let speech = null;

    speech = createSpeechController({
      onTranscriptUpdate: function (text) {
        liveDraftTranscript = text;
        if (liveTranscriptEl) {
          liveTranscriptEl.hidden = false;
          liveTranscriptEl.textContent = text || 'מקשיב... דבר/י עכשיו';
        }
        clearSilenceTimer();
      },
      onRecordingStateChange: function (recordingFlag) {
        isRecording = recordingFlag;
        if (!recordingFlag) {
          isFinalizingVoice = false;
        }
        updatePttVisualState();
      },
      onRecordingComplete: function (finalText) {
        isFinalizingVoice = false;
        isRecording = false;
        setSessionInputsDisabled(false);
        updatePttVisualState();
        if (finalText && finalText.trim()) {
          submitUserTurnText(finalText.trim(), 'voice');
        }
      },
      onRecordingEmpty: function (info) {
        isFinalizingVoice = false;
        isRecording = false;
        setSessionInputsDisabled(false);
        updatePttVisualState();
        if (liveTranscriptEl) {
          liveTranscriptEl.hidden = true;
          liveTranscriptEl.textContent = '';
        }
        const elapsed = info && typeof info.elapsedMs === 'number' ? info.elapsedMs : 0;
        const events = info && Array.isArray(info.events) ? info.events : [];
        const diag = info && info.diagTag ? ' ' + info.diagTag : '';
        if (elapsed > 0 && elapsed < 1800 && !events.includes('speech')) {
          showSpeechNotice(
            'המיקרופון של Chrome נסגר מיד בלי קליטת דיבור. נסה להקיש ולהתחיל לדבר מיד אחרי הצפצוף, או הקש על התיבה למטה והכתב דרך המיקרופון במקלדת (Gboard).' +
              diag
          );
        } else {
          showSpeechNotice(
            'לא נקלט דיבור בהקלטה. הקש שוב ודבר מיד אחרי הצפצוף, או הכתב דרך המיקרופון במקלדת למטה.' +
              diag
          );
        }
        armSilenceTimerIfEligible();
      },
      onSpeechError: function (err) {
        isFinalizingVoice = false;
        isRecording = false;
        setSessionInputsDisabled(false);
        updatePttVisualState();
        if (liveTranscriptEl) {
          liveTranscriptEl.hidden = true;
          liveTranscriptEl.textContent = '';
        }
        showSpeechNotice(err.message);
        armSilenceTimerIfEligible();
      },
      onTtsAvailabilityChange: function (info) {
        updateTtsButtonLabel(info);
      }
    });

    function switchView(viewName) {
      Object.keys(views).forEach((k) => {
        if (views[k]) {
          views[k].classList.toggle('active', k === viewName);
        }
      });
      window.scrollTo(0, 0);
    }

    function showSpeechNotice(msg) {
      if (!speechNoticeEl) return;
      if (!msg) {
        speechNoticeEl.hidden = true;
        speechNoticeEl.textContent = '';
      } else {
        speechNoticeEl.hidden = false;
        speechNoticeEl.textContent = msg;
      }
    }

    function updateTtsButtonLabel(info) {
      if (!btnToggleTts) return;
      const caps = speech
        ? speech.getCapabilities()
        : {
            ttsSupported: Boolean(info && info.supported),
            hasHebrewVoice: Boolean(info && info.hasHebrew),
            ttsEnabled: true
          };
      if (!caps.ttsSupported || !caps.hasHebrewVoice) {
        btnToggleTts.textContent = 'קול: טקסט בלבד';
        btnToggleTts.title = 'לא זוהה קול עברי במכשיר — המטופל מוצג בטקסט';
        btnToggleTts.disabled = true;
        return;
      }
      btnToggleTts.disabled = false;
      btnToggleTts.textContent = caps.ttsEnabled ? 'קול: פעיל' : 'קול: מושתק';
    }

    function updatePttVisualState() {
      if (!btnPtt) return;
      if (isFinalizingVoice) {
        btnPtt.classList.add('recording');
        btnPttMainText.textContent = 'מעבד דיבור...';
        btnPttSubText.textContent = 'רק רגע';
        btnCancelRec.hidden = true;
      } else if (isRecording) {
        btnPtt.classList.add('recording');
        btnPttMainText.textContent = 'מקשיב... הקש לסיום ושליחה';
        btnPttSubText.textContent = 'דבר/י עכשיו — השליחה אוטומטית בסיום המשפט';
        btnCancelRec.hidden = false;
      } else {
        btnPtt.classList.remove('recording');
        btnPttMainText.textContent = 'הקש ודבר';
        btnPttSubText.textContent = 'הקשה אחת להפעלה · השליחה אוטומטית בסיום הדיבור';
        btnCancelRec.hidden = true;
      }
    }

    function clearSilenceTimer() {
      if (silenceTimerId) {
        clearTimeout(silenceTimerId);
        silenceTimerId = null;
      }
    }

    function armSilenceTimerIfEligible() {
      clearSilenceTimer();
      if (!activeSession || activeSession.isCompleted) return;
      if (isBusyPatientTurn || isPatientSpeaking || isRecording || isFinalizingVoice) return;
      if (consecutiveSilencesThisTurn >= MAX_CONSECUTIVE_SILENCE_PROMPTS) return;
      if (textBackupInput && textBackupInput.value.trim().length > 0) return;

      silenceTimerId = setTimeout(function () {
        handleUserSilenceTimeout();
      }, SILENCE_TIMEOUT_MS);
    }

    function handleUserSilenceTimeout() {
      if (
        !activeSession ||
        activeSession.isCompleted ||
        isRecording ||
        isFinalizingVoice ||
        isBusyPatientTurn ||
        isPatientSpeaking
      ) {
        return;
      }
      consecutiveSilencesThisTurn += 1;

      const silenceMsg = registerSilenceReaction(activeSession);
      if (!silenceMsg) {
        return;
      }

      appendBubble('patient', activeSession.scenario.patientName, silenceMsg.text);
      isPatientSpeaking = true;
      activeSpeechHandle = speech.speakPatientLine(
        silenceMsg.text,
        activeSession.scenario.gender,
        function () {
          isPatientSpeaking = false;
          armSilenceTimerIfEligible();
        }
      );
    }

    function setSessionInputsDisabled(disabled) {
      if (btnPtt) btnPtt.disabled = disabled;
      if (btnSendText) btnSendText.disabled = disabled;
    }

    function appendBubble(role, senderName, text) {
      const row = document.createElement('div');
      row.className = 'bubble-row ' + role;

      const sender = document.createElement('div');
      sender.className = 'bubble-sender';
      sender.textContent = role === 'patient' ? senderName : 'אני (מטפל/ת)';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(sender);
      row.appendChild(bubble);
      chatStreamEl.appendChild(row);
      scrollToLatestBubble();
    }

    function scrollToLatestBubble() {
      requestAnimationFrame(function () {
        chatStreamEl.scrollTop = chatStreamEl.scrollHeight;
      });
    }

    function updateTurnCounter() {
      if (!activeSession || !sessionTurnCounterEl) return;
      const done = activeSession.turns.length;
      const max = activeSession.maxTurns;
      sessionTurnCounterEl.textContent = 'תור ' + Math.min(done + 1, max) + ' מתוך ' + max;
    }

    function renderHomeScenarios() {
      const all = getAllScenarios();
      const saved = loadSessions();
      if (scenariosCountEl) {
        scenariosCountEl.textContent = all.length + ' תרחישים זמינים';
      }
      if (btnOpenHistory) {
        btnOpenHistory.textContent =
          saved.length > 0
            ? 'היסטוריה ודוחות (' + saved.length + ')'
            : 'היסטוריה ודוחות קודמים';
      }

      scenariosGridEl.innerHTML = '';
      all.forEach(function (sc) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'scenario-card';
        card.setAttribute('data-scenario-id', sc.id);

        card.innerHTML =
          '<div>' +
          '<div class="scenario-card-top">' +
          '<h3 class="scenario-name-title">' +
          escapeHtml(sc.title) +
          ' · ' +
          escapeHtml(sc.patientName) +
          '</h3>' +
          '<span class="difficulty-badge">' +
          escapeHtml(difficultyLabel(sc.difficulty)) +
          '</span>' +
          '</div>' +
          '<p class="scenario-desc">' +
          escapeHtml(sc.personalityLine) +
          '</p>' +
          '</div>' +
          '<div class="scenario-footer-meta">' +
          '<span>דפוס: ' +
          escapeHtml(sc.corePattern) +
          '</span>' +
          '<span class="scenario-start-cta">התחל סשן ←</span>' +
          '</div>';

        card.addEventListener('click', function () {
          startSession(sc, false);
        });

        scenariosGridEl.appendChild(card);
      });
    }

    function startFreeSession() {
      const all = getAllScenarios();
      if (all.length === 0) return;
      let candidates = all;
      if (all.length > 1 && lastScenarioIdPlayed) {
        candidates = all.filter((s) => s.id !== lastScenarioIdPlayed);
      }
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      startSession(chosen, true);
    }

    function startSession(scenario, isFreeSession) {
      clearSilenceTimer();
      speech.cancelRecording();
      speech.stopSpeaking();
      activeSpeechHandle = null;

      lastScenarioIdPlayed = scenario.id;
      activeSession = createSessionState(scenario, { isFreeSession });
      isBusyPatientTurn = false;
      isPatientSpeaking = false;
      isFinalizingVoice = false;
      consecutiveSilencesThisTurn = 0;
      liveDraftTranscript = '';

      showSpeechNotice('');
      if (liveTranscriptEl) {
        liveTranscriptEl.hidden = true;
        liveTranscriptEl.textContent = '';
      }
      if (textBackupInput) {
        textBackupInput.value = '';
      }

      // בסשן חופשי לא חושפים את שם התבנית בכותרת במהלך השיחה כדי לשמור על תרגול עיוור
      sessionPatientNameEl.textContent = isFreeSession
        ? scenario.patientName + ' (סשן חופשי)'
        : scenario.patientName + ' — ' + scenario.title;

      updateTurnCounter();
      updateTtsButtonLabel();
      updatePttVisualState();
      setSessionInputsDisabled(false);

      chatStreamEl.innerHTML = '';
      switchView('session');

      // משפט פתיחה של המטופל המדומה — מאפשרים למשתמש להקיש ולדבר גם בלי להמתין אם ה-TTS איטי
      appendBubble('patient', scenario.patientName, scenario.openingLine);
      isPatientSpeaking = true;

      activeSpeechHandle = speech.speakPatientLine(
        scenario.openingLine,
        scenario.gender,
        function () {
          isPatientSpeaking = false;
          armSilenceTimerIfEligible();
        }
      );
    }

    function submitUserTurnText(text, mode) {
      const cleaned = String(text || '').trim();
      if (!cleaned || !activeSession || activeSession.isCompleted || isBusyPatientTurn) {
        return;
      }

      clearSilenceTimer();
      if (activeSpeechHandle) {
        activeSpeechHandle.cancel();
        activeSpeechHandle = null;
      } else {
        speech.stopSpeaking();
      }
      isPatientSpeaking = false;
      isFinalizingVoice = false;
      consecutiveSilencesThisTurn = 0;
      liveDraftTranscript = '';

      if (liveTranscriptEl) {
        liveTranscriptEl.hidden = true;
        liveTranscriptEl.textContent = '';
      }
      if (textBackupInput) {
        textBackupInput.value = '';
      }
      showSpeechNotice('');

      isBusyPatientTurn = true;
      setSessionInputsDisabled(true);

      const turnRec = processUserTurn(activeSession, cleaned, mode);
      appendBubble('therapist', 'אני', turnRec.userText);

      // השהיה שיחתית קצרה וטבעית לפני תגובת המטופל
      const typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.textContent = activeSession.scenario.patientName + ' מגיב/ה...';
      chatStreamEl.appendChild(typingEl);
      scrollToLatestBubble();

      setTimeout(function () {
        if (typingEl.parentNode) {
          typingEl.parentNode.removeChild(typingEl);
        }
        if (!activeSession) return;

        appendBubble('patient', activeSession.scenario.patientName, turnRec.patientAfter);

        if (activeSession.isCompleted) {
          sessionTurnCounterEl.textContent =
            'הושלמו ' + activeSession.maxTurns + ' מתוך ' + activeSession.maxTurns + ' תורות';
          isPatientSpeaking = true;
          activeSpeechHandle = speech.speakPatientLine(
            turnRec.patientAfter,
            activeSession.scenario.gender,
            function () {
              isPatientSpeaking = false;
              finishAndOpenReport(false);
            }
          );
        } else {
          updateTurnCounter();
          isBusyPatientTurn = false;
          setSessionInputsDisabled(false);
          isPatientSpeaking = true;
          activeSpeechHandle = speech.speakPatientLine(
            turnRec.patientAfter,
            activeSession.scenario.gender,
            function () {
              isPatientSpeaking = false;
              armSilenceTimerIfEligible();
            }
          );
        }
      }, 550);
    }

    function finishAndOpenReport(endedEarly) {
      clearSilenceTimer();
      speech.cancelRecording();
      if (activeSpeechHandle) {
        activeSpeechHandle.cancel();
        activeSpeechHandle = null;
      } else {
        speech.stopSpeaking();
      }
      isBusyPatientTurn = false;
      isPatientSpeaking = false;
      isFinalizingVoice = false;

      if (!activeSession || activeSession.turns.length === 0) {
        activeSession = null;
        renderHomeScenarios();
        switchView('home');
        return;
      }

      const report = buildSessionReport(activeSession, endedEarly);
      saveSessionReport(report);
      activeSession = null;

      reportReturnView = 'home';
      renderReportView(report);
      switchView('report');
    }

    // ניהול כפתור הדיבור מותאם אנדרואיד: הקשה אחת להפעלה (Tap-to-Talk) ללא pointerdown וללא לולאת הפעלה מחדש
    btnPtt.addEventListener('click', function () {
      if (btnPtt.disabled || isBusyPatientTurn || isFinalizingVoice || !activeSession) return;

      if (!isRecording) {
        if (isPatientSpeaking && activeSpeechHandle) {
          activeSpeechHandle.cancel();
          activeSpeechHandle = null;
          isPatientSpeaking = false;
        }
        liveDraftTranscript = '';
        showSpeechNotice('');
        clearSilenceTimer();
        if (liveTranscriptEl) {
          liveTranscriptEl.hidden = false;
          liveTranscriptEl.textContent = 'מקשיב... דבר/י עכשיו';
        }
        const ok = speech.startRecording();
        if (!ok && liveTranscriptEl) {
          liveTranscriptEl.hidden = true;
        }
      } else {
        // הקשה שנייה לסיום מוקדם ושליחה (ההמתנה היא לאירוע onend עם טיימר הגנה ב-speech.js)
        isFinalizingVoice = true;
        setSessionInputsDisabled(true);
        updatePttVisualState();
        speech.stopRecording();
      }
    });

    btnPtt.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
    });

    btnCancelRec.addEventListener('click', function () {
      isFinalizingVoice = false;
      speech.cancelRecording();
      setSessionInputsDisabled(false);
      liveDraftTranscript = '';
      if (liveTranscriptEl) {
        liveTranscriptEl.hidden = true;
        liveTranscriptEl.textContent = '';
      }
      showSpeechNotice('');
      armSilenceTimerIfEligible();
    });

    // גיבוי הקלדה או הכתבה דרך המיקרופון במקלדת אנדרואיד (Gboard)
    textBackupInput.addEventListener('input', function () {
      if (textBackupInput.value.trim().length > 0) {
        clearSilenceTimer();
      } else {
        armSilenceTimerIfEligible();
      }
    });

    textBackupInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        if (typeof textBackupForm.requestSubmit === 'function') {
          textBackupForm.requestSubmit();
        } else {
          textBackupForm.dispatchEvent(new Event('submit', { cancelable: true }));
        }
      }
    });

    textBackupForm.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (isBusyPatientTurn || !activeSession) return;
      const val = textBackupInput.value.trim();
      if (!val) return;
      if (isRecording || isFinalizingVoice) {
        isFinalizingVoice = false;
        speech.cancelRecording();
      }
      submitUserTurnText(val, 'text');
    });

    btnToggleTts.addEventListener('click', function () {
      const caps = speech.getCapabilities();
      speech.setTtsEnabled(!caps.ttsEnabled);
      updateTtsButtonLabel();
    });

    btnEndSession.addEventListener('click', function () {
      if (!activeSession) {
        switchView('home');
        return;
      }
      finishAndOpenReport(true);
    });

    // רינדור דוח סוף סשן (כל 5 הסעיפים הנדרשים במפרט, המספר קודם להסבר)
    function renderReportView(report) {
      const allSessions = loadSessions();
      const longitudinal = computeLongitudinalStats(allSessions);
      const m = report.metrics;

      // 1 + 2: פרופיל התערבויות והשפעה על המטופל בסשן
      let profileRowsHtml = '';
      for (const key of ORDERED_TYPE_KEYS) {
        const b = report.profileByType[key];
        if (!b || b.count === 0) continue;
        const impact = formatOpennessImpact(b);
        const addOnNote =
          b.addOnsInType > 0 ? ' · מתוכן ' + b.addOnsInType + ' עם תוספת' : '';

        profileRowsHtml +=
          '<div class="profile-row">' +
          '<div class="profile-row-header">' +
          '<div>' +
          '<span class="profile-num-first ltr-num">' +
          b.count +
          ' (' +
          b.percentage +
          '%)</span>' +
          '<span class="profile-type-name">' +
          escapeHtml(b.label) +
          escapeHtml(addOnNote) +
          '</span>' +
          '</div>' +
          '<span class="delta-pill ' +
          impact.cls +
          '">' +
          escapeHtml(impact.text) +
          '</span>' +
          '</div>' +
          '<div class="bar-track"><div class="bar-fill ' +
          impact.barCls +
          '" style="width:' +
          Math.max(4, b.percentage) +
          '%"></div></div>' +
          '</div>';
      }

      // 4: שני רגעים מסומנים
      const best = report.highlights && report.highlights.bestTurn;
      const repair = report.highlights && report.highlights.repairTurn;

      const bestHtml = best
        ? '<div class="highlight-block">' +
          '<h4 class="highlight-heading">ההתערבות שפתחה את המטופל/ת הכי הרבה (תור ' +
          best.turnNumber +
          ' · ' +
          escapeHtml(best.displayLabel) +
          ')</h4>' +
          '<div class="quote-context">לפני כן המטופל/ת אמר/ה: ״' +
          escapeHtml(best.patientBefore) +
          '״</div>' +
          '<div class="quote-user">״' +
          escapeHtml(best.userText) +
          '״</div>' +
          '<div class="quote-context">תוצאה בסשן: <strong>' +
          (best.opennessDelta > 0
            ? '▲ +' + best.opennessDelta + ' במד הפתיחות'
            : '▲ שימור פתיחות מרבית (3/3)') +
          '</strong></div>' +
          '</div>'
        : '<div class="highlight-block">' +
          '<h4 class="highlight-heading">ההתערבות שפתחה את המטופל/ת הכי הרבה</h4>' +
          '<div class="quote-context">בסשן זה לא נרשמה התערבות שהעלתה את מד הפתיחות (תצפית, הדהוד, מתן בחירה, תיקון או רגש של המטפל).</div>' +
          '</div>';

      const repairHtml = repair
        ? '<div class="highlight-block repair-moment">' +
          '<h4 class="highlight-heading">רגע אחד לתיקון (תור ' +
          repair.turnNumber +
          ' · ' +
          escapeHtml(repair.displayLabel) +
          ')</h4>' +
          '<div class="quote-context">לפני כן המטופל/ת אמר/ה: ״' +
          escapeHtml(repair.patientBefore) +
          '״</div>' +
          '<div class="quote-user">״' +
          escapeHtml(repair.userText) +
          '״</div>' +
          '<div class="quote-context">' +
          escapeHtml(repair.reason) +
          '</div>' +
          '<div class="alternative-box"><strong>ניסוח חלופי מוצע (מהלך אחד, בלי תוספת):</strong><br>' +
          escapeHtml(repair.suggestedAlternative) +
          '</div>' +
          '</div>'
        : '<div class="highlight-block repair-moment">' +
          '<h4 class="highlight-heading">רגע אחד לתיקון</h4>' +
          '<div class="quote-context">כל התורות בסשן זה נשמרו כמהלך יחיד נקי ללא תוספות וללא ירידת פתיחות.</div>' +
          '</div>';

      // תמליל מפורט לפי תור
      let turnsLogHtml = '';
      (report.turns || []).forEach(function (t) {
        turnsLogHtml +=
          '<div class="turn-log-item">' +
          '<div><strong>תור ' +
          t.turnNumber +
          ':</strong> ' +
          escapeHtml(t.displayLabel) +
          ' · <span class="ltr-num">' +
          t.wordCount +
          '</span> מילים · <span class="ltr-num">' +
          t.questionCount +
          '</span> שאלות · פתיחות: <span class="ltr-num">' +
          t.opennessBefore +
          ' → ' +
          t.opennessAfter +
          '</span></div>' +
          '<div class="quote-context">מטופל/ת: ״' +
          escapeHtml(t.patientBefore) +
          '״</div>' +
          '<div>מטפל/ת: <strong>״' +
          escapeHtml(t.userText) +
          '״</strong></div>' +
          '</div>';
      });

      const emotionsSub =
        m.introducedEmotionWords && m.introducedEmotionWords.length > 0
          ? 'מילים: ' + m.introducedEmotionWords.join(', ')
          : 'לא הוכנסו מילות רגש זרות לדברי המטופל/ת';

      reportBodyEl.innerHTML =
        '<div class="report-summary-banner">' +
        '<div class="summary-meta-item">' +
        '<span class="summary-meta-val">' +
        escapeHtml(report.scenarioTitle) +
        ' (' +
        escapeHtml(report.patientName) +
        ')</span>' +
        '<span class="summary-meta-lbl">' +
        escapeHtml(formatDateTimeHe(report.timestamp)) +
        (report.isFreeSession ? ' · סשן חופשי' : '') +
        (report.endedEarly ? ' · סיום מוקדם' : '') +
        '</span>' +
        '</div>' +
        '<div class="summary-meta-item">' +
        '<span class="summary-meta-val ltr-num">' +
        report.turnsCount +
        ' / ' +
        (report.maxTurns || 8) +
        '</span>' +
        '<span class="summary-meta-lbl">תורות בסשן</span>' +
        '</div>' +
        '<div class="summary-meta-item">' +
        '<span class="summary-meta-val">' +
        report.initialOpenness +
        ' ← ' +
        report.finalOpenness +
        ' (מתוך 3)</span>' +
        '<span class="summary-meta-lbl">שינוי במד פתיחות המטופל/ת</span>' +
        '</div>' +
        '</div>' +
        // סעיף 3: מדדי מכניקה (המספר קודם להסבר)
        '<section class="report-card">' +
        '<h3 class="report-card-title">מדדי מכניקה בסשן</h3>' +
        '<div class="metrics-grid">' +
        '<div class="metric-box">' +
        '<span class="metric-number ltr-num">' +
        m.avgQuestionsPerTurn +
        '</span>' +
        '<span class="metric-title">ממוצע שאלות בתור</span>' +
        '<span class="metric-sub">סה״כ ' +
        m.totalQuestions +
        ' שאלות ב־' +
        report.turnsCount +
        ' תורות</span>' +
        '</div>' +
        '<div class="metric-box">' +
        '<span class="metric-number ltr-num">' +
        m.avgWordsPerTurn +
        '</span>' +
        '<span class="metric-title">ממוצע מילים בתור</span>' +
        '<span class="metric-sub">סה״כ ' +
        m.totalWords +
        ' מילים בסשן</span>' +
        '</div>' +
        '<div class="metric-box">' +
        '<span class="metric-number ltr-num">' +
        m.addOnsCount +
        '</span>' +
        '<span class="metric-title">תוספות אחרי משפט שלם</span>' +
        '<span class="metric-sub">משפט המשך או שאלה אחרי תצפית</span>' +
        '</div>' +
        '<div class="metric-box">' +
        '<span class="metric-number ltr-num">' +
        m.introducedEmotionsCount +
        '</span>' +
        '<span class="metric-title">מילות רגש שהוכנסו</span>' +
        '<span class="metric-sub">' +
        escapeHtml(emotionsSub) +
        '</span>' +
        '</div>' +
        '<div class="metric-box">' +
        '<span class="metric-number ltr-num">' +
        m.echoCount +
        '</span>' +
        '<span class="metric-title">מספר הדהודים</span>' +
        '<span class="metric-sub">חזרה נקייה על ביטוי מדברי המטופל/ת</span>' +
        '</div>' +
        (report.silenceEventsCount > 0
          ? '<div class="metric-box">' +
            '<span class="metric-number ltr-num">' +
            report.silenceEventsCount +
            '</span>' +
            '<span class="metric-title">המתנות שתיקה (20 שנ׳)</span>' +
            '<span class="metric-sub">תגובות מטופל/ת לשתיקה בחדר</span>' +
            '</div>'
          : '') +
        '</div>' +
        '</section>' +
        // סעיפים 1 + 2: פרופיל התערבויות ומה כל סוג עשה למטופל
        '<section class="report-card">' +
        '<h3 class="report-card-title">פרופיל התערבויות והשפעה על המטופל/ת בסשן</h3>' +
        '<div class="profile-list">' +
        profileRowsHtml +
        '</div>' +
        '</section>' +
        // סעיף 4: שני רגעים מסומנים
        '<section class="report-card">' +
        '<h3 class="report-card-title">שני רגעים מסומנים מתוך השיחה</h3>' +
        bestHtml +
        repairHtml +
        '<details class="turns-accordion" style="margin-top:12px;">' +
        '<summary>הצגת פירוט מלא של כל תורות הסשן (' +
        report.turnsCount +
        ')</summary>' +
        '<div>' +
        turnsLogHtml +
        '</div>' +
        '</details>' +
        '</section>' +
        // סעיף 5: מעקב לאורך זמן
        '<section class="report-card">' +
        '<h3 class="report-card-title">מעקב לאורך זמן (כל הסשנים השמורים)</h3>' +
        renderTrendSvg(longitudinal.series) +
        '<div style="margin-top:16px;">' +
        '<h4 class="highlight-heading">טבלת פרופיל מצטבר</h4>' +
        renderCumulativeTable(longitudinal) +
        '</div>' +
        '</section>';
    }

    // רינדור מסך היסטוריה ודוחות קודמים
    function renderHistoryView() {
      const sessions = loadSessions();
      const longitudinal = computeLongitudinalStats(sessions);

      if (sessions.length === 0) {
        historyBodyEl.innerHTML =
          '<section class="report-card">' +
          '<h3 class="report-card-title">אין עדיין סשנים שמורים</h3>' +
          '<p class="quote-context">לאחר השלמת סשן אימון, הדוח והמדדים יישמרו אוטומטית בדפדפן ויופיעו כאן.</p>' +
          '</section>';
        return;
      }

      const reversed = sessions.slice().reverse();
      let listHtml = '';
      reversed.forEach(function (s, revIdx) {
        const chronologicalNumber = sessions.length - revIdx;
        listHtml +=
          '<button type="button" class="history-item-card" data-session-id="' +
          escapeHtml(s.id) +
          '">' +
          '<div>' +
          '<div><strong>סשן #' +
          chronologicalNumber +
          ' · ' +
          escapeHtml(s.scenarioTitle) +
          ' (' +
          escapeHtml(s.patientName) +
          ')</strong></div>' +
          '<div class="quote-context">' +
          escapeHtml(formatDateTimeHe(s.timestamp)) +
          ' · ' +
          s.turnsCount +
          ' תורות · שאלות/תור: <span class="ltr-num">' +
          (s.metrics ? s.metrics.avgQuestionsPerTurn : 0) +
          '</span> · מילים/תור: <span class="ltr-num">' +
          (s.metrics ? s.metrics.avgWordsPerTurn : 0) +
          '</span></div>' +
          '</div>' +
          '<span class="scenario-start-cta">לדוח ←</span>' +
          '</button>';
      });

      historyBodyEl.innerHTML =
        '<section class="report-card">' +
        '<h3 class="report-card-title">גרף מגמה לאורך זמן</h3>' +
        renderTrendSvg(longitudinal.series) +
        '</section>' +
        '<section class="report-card">' +
        '<h3 class="report-card-title">טבלת פרופיל מצטבר</h3>' +
        renderCumulativeTable(longitudinal) +
        '</section>' +
        '<section class="report-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
        '<h3 class="report-card-title" style="margin:0;border:none;padding:0;">דוחות סשנים קודמים (' +
        sessions.length +
        ')</h3>' +
        '<button type="button" id="btn-clear-history" class="btn-ghost">מחק היסטוריה</button>' +
        '</div>' +
        '<div class="history-session-list">' +
        listHtml +
        '</div>' +
        '</section>';

      historyBodyEl.querySelectorAll('.history-item-card').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const id = btn.getAttribute('data-session-id');
          const found = sessions.find((item) => item.id === id);
          if (found) {
            reportReturnView = 'history';
            renderReportView(found);
            switchView('report');
          }
        });
      });

      const clearBtn = document.getElementById('btn-clear-history');
      if (clearBtn) {
        clearBtn.addEventListener('click', function () {
          if (window.confirm('למחוק את כל היסטוריית הסשנים השמורה במכשיר זה?')) {
            clearAllSessions();
            renderHistoryView();
            renderHomeScenarios();
          }
        });
      }
    }

    btnFreeSession.addEventListener('click', startFreeSession);

    btnOpenHistory.addEventListener('click', function () {
      renderHistoryView();
      switchView('history');
    });

    btnReportBackHome.addEventListener('click', function () {
      if (reportReturnView === 'history') {
        renderHistoryView();
        switchView('history');
      } else {
        renderHomeScenarios();
        switchView('home');
      }
    });

    btnHistoryBackHome.addEventListener('click', function () {
      renderHomeScenarios();
      switchView('home');
    });

    renderHomeScenarios();
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  }
})(typeof globalThis !== 'undefined' ? globalThis : window);


if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
  </script>
</body>
</html>
